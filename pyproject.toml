[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E701",  # multiple-statements-on-one-line-colon — deliberate compact
             # style in flowcore.py's cmd_selftest() counter pattern
]

[tool.ruff.lint.per-file-ignores]
"flowcore.py" = ["E402", "F401", "F841"]   # sys.path.insert() + optional deps + unused sentinels
"tests/test_api.py" = ["E402"]             # pytest.importorskip() must run before TestClient import
"tests/test_alerts_api.py" = ["E402"]      # pytest.importorskip() must run before TestClient import
"tests/test_ask_compliance.py" = ["E402"]  # pytest.importorskip() must run before TestClient import
