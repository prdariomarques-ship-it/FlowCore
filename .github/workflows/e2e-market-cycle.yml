name: E2E Market Cycle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-cycle:
    name: validate-cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python3 scripts/validate_cycle_e2e.py

  smoke-market-api:
    name: smoke-market-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python3 scripts/smoke_market_intel.py

  telegram-config:
    name: telegram-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_telegram.py
