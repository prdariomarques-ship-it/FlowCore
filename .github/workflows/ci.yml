name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.22
      - run: ruff format --check .
      - run: ruff check .

  test-core:
    name: Core tests (requirements-core.txt only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-core.txt pytest pytest-asyncio
      - run: pytest -q

  test-api:
    name: API tests (requirements-api.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-api.txt pytest
      - run: pytest -q tests/test_api.py -v
